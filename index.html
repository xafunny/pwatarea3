<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Tecnología</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="barra">
        <h1>Papeleria Xafunny</h1>
        <button id="btn-carrito" class="btn-carrito" aria-expanded="false">
             Carrito 🛒 (<span id="contador">0</span>)
        </button>
    </header>

    <aside id="panel-carrito" class="panel-carrito" hidden>
        <h2>Tu carrito</h2>
        <ul id="lista-carrito"></ul>
        <p class="total">Total: $<span id="total">0.00</span></p>
        <button id="btn-vaciar" class="btn-secundario">Vaciar carrito</button>
    </aside>

    <main class="contenedor">
        <h2>TIPOS DE AUDÍFONOS</h2>
        <section id="productos" class="grilla"></section>
    </main>

    <footer class="pie">
        <small id="modo"></small>
    </footer>

    <div id="aviso" class="aviso" role="status"></div>

    <script src="productos-respaldo.js"></script>
    <script src="script.js"></script>
</body>
</html>
